<div class="catalogue-item">
  <div>
    {% if include.sticky == 'true' %}
    <span class="catalogue-pinned">Pinned &middot;</span>
    {% endif %}
    
    <!-- 1. 태그 영역: 클릭 시 카테고리 탭의 해당 태그로 이동합니다 -->
    {% for tag in post.tags %}
      <a href="{{ '/tags/#' | append: tag | prepend: site.baseurl }}" class="tag-badge">{{ tag }}</a>
    {% endfor %}

    <!-- 2. 게시글 본문 영역: 클릭 시 포스트로 이동합니다 -->
    <a href="{{ post.url | prepend: site.baseurl }}" style="display: block; text-decoration: none; color: inherit; padding-top: 0.5rem;">
      <time datetime="{{ post.date }}" class="catalogue-time">{{ post.date | date: "%B %d, %Y" }}</time>
      <h1 class="catalogue-title">{{ post.title }}</h1>
      <div class="catalogue-line"></div>
      <p>
        {% if post.excerpt_separator %}
          {{ post.excerpt | strip_html }}
        {% else %}
          {{ post.content | strip_html | truncatewords: 30 }}
        {% endif %}
      </p>
    </a>
  </div>
</div>
