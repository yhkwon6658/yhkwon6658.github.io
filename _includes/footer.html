  <!-- 다크 모드 스크립트 -->
  <script>
    // 다크 모드 버튼 가져오기
    const themeToggle = document.getElementById('theme-toggle');
    console.log('Theme toggle button:', themeToggle); // 버튼 확인
  
    // 로컬 스토리지에서 현재 테마 확인
    const currentTheme = localStorage.getItem('theme');
    console.log('Current theme from storage:', currentTheme); // 저장된 테마 확인
  
    if (currentTheme === 'dark') {
      document.body.classList.add('dark-mode'); // 다크 모드 활성화
      themeToggle.textContent = '☀️'; // 라이트 모드 아이콘
    }
  
    // 다크 모드 전환 로직
    themeToggle.addEventListener('click', () => {
      console.log('Button clicked'); // 버튼 클릭 로그
      document.body.classList.toggle('dark-mode'); // 다크 모드 토글
      if (document.body.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark'); // 다크 모드 상태 저장
        themeToggle.textContent = '☀️'; // 라이트 모드 아이콘
        console.log('Dark mode activated'); // 활성화 로그
      } else {
        localStorage.setItem('theme', 'light'); // 다크 모드 상태 저장
        themeToggle.textContent = '🌙'; // 라이트 모드 아이콘
        console.log('Dark mode deactivated'); // 비활성화 로그
      }
    });
  </script>

  <!-- 코드 블록 복사 버튼 스크립트 추가 -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        var codeBlocks = document.querySelectorAll('div.highlighter-rouge');

        // 복사 아이콘 (기본 상태)
        var iconCopy = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 18px; height: 18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>';
        
        // 체크 아이콘 (복사 완료 상태)
        var iconCheck = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 18px; height: 18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>';

        codeBlocks.forEach(function(block) {
            
            // --- 맥OS 버튼 컨테이너 추가 ---
            var macButtons = document.createElement('div');
            macButtons.className = 'mac-buttons';
            
            var btnRed = document.createElement('button');
            btnRed.className = 'mac-btn mac-btn-red';
            btnRed.type = 'button';
            btnRed.title = '완전 접기';

            var btnYellow = document.createElement('button');
            btnYellow.className = 'mac-btn mac-btn-yellow';
            btnYellow.type = 'button';
            btnYellow.title = '본문 접기';

            var btnGreen = document.createElement('button');
            btnGreen.className = 'mac-btn mac-btn-green';
            btnGreen.type = 'button';
            btnGreen.title = '원상 복구';
            
            macButtons.appendChild(btnRed);
            macButtons.appendChild(btnYellow);
            macButtons.appendChild(btnGreen);
            
            block.appendChild(macButtons);


            // --- 복사 버튼 로직 ---
            var copyButton = document.createElement('button');
            copyButton.className = 'copy-btn';
            copyButton.type = 'button';
            copyButton.innerHTML = iconCopy; 

            block.appendChild(copyButton);

            copyButton.addEventListener('click', function() {
                var code = block.querySelector('code');
                var text = code.innerText;

                navigator.clipboard.writeText(text).then(function() {
                    copyButton.innerHTML = iconCheck; 
                    copyButton.classList.add('copied');

                    setTimeout(function() {
                        copyButton.innerHTML = iconCopy; 
                        copyButton.classList.remove('copied');
                    }, 2000);
                });
            });
            
            // --- 윈도우 버튼 이벤트 리스너 ---
            
            // 노란색 버튼: 본문만 숨기기 (상단 패널 유지)
            btnYellow.addEventListener('click', function() {
                block.classList.remove('collapsed-red'); // 다른 접힘 상태 해제
                block.classList.add('collapsed-yellow');
            });

            // 빨간색 버튼: 완전 접기 (패널 내용까지 숨기기)
            btnRed.addEventListener('click', function() {
                block.classList.remove('collapsed-yellow');
                block.classList.add('collapsed-red');
            });

            // 초록색 버튼: 원상 복구
            btnGreen.addEventListener('click', function() {
                block.classList.remove('collapsed-yellow');
                block.classList.remove('collapsed-red');
            });
        });
    });
  </script>

</footer>
