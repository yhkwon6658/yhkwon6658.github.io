<aside class="visitor-stats" aria-label="Visitor statistics">
  <div class="visitor-stats-title">VISITS</div>

  <div class="visitor-stat-row">
    <span>Today</span>
    <span id="visitor-today">—</span>
  </div>

  <div class="visitor-stat-row">
    <span>Total</span>
    <span id="visitor-total">—</span>
  </div>

  {% if page.collection == "posts" %}
  <div class="visitor-stat-row">
    <span>Post</span>
    <span id="visitor-post">—</span>
  </div>
  {% endif %}
</aside>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const counterBase =
    "https://yhkwon6658.goatcounter.com/counter/";

  const totalUrl =
    counterBase + "TOTAL.json";

  const now = new Date();
  const today =
    now.getFullYear() + "-" +
    String(now.getMonth() + 1).padStart(2, "0") + "-" +
    String(now.getDate()).padStart(2, "0");

  try {
    const todayResponse = await fetch(
      `${totalUrl}?start=${today}`
    );

    const totalResponse = await fetch(totalUrl);

    if (!todayResponse.ok || !totalResponse.ok) {
      throw new Error("GoatCounter request failed");
    }

    const todayData = await todayResponse.json();
    const totalData = await totalResponse.json();

    document.getElementById("visitor-today").textContent =
      todayData.count;

    document.getElementById("visitor-total").textContent =
      totalData.count;

    const postElement =
      document.getElementById("visitor-post");

    if (postElement) {
      const path = location.pathname;

      const postResponse = await fetch(
        counterBase +
        encodeURIComponent(path) +
        ".json"
      );

      if (postResponse.ok) {
        const postData = await postResponse.json();

        postElement.textContent =
          postData.count;
      }
    }
  } catch (error) {
    console.error(
      "Failed to load visitor statistics:",
      error
    );
  }
});
</script>
