<div class="pdf-widget" id="{{ include.id }}">

  <div class="pdf-widget-header">

    <div class="pdf-window-buttons">
      <button
        type="button"
        class="pdf-window-btn red pdf-btn-red"
        aria-label="Minimize PDF widget"
        title="Minimize">
      </button>

      <button
        type="button"
        class="pdf-window-btn yellow pdf-btn-yellow"
        aria-label="Collapse PDF viewer"
        title="Collapse">
      </button>

      <button
        type="button"
        class="pdf-window-btn green pdf-btn-green"
        aria-label="Restore PDF viewer"
        title="Restore">
      </button>
    </div>

    <div class="pdf-widget-title">
      {{ include.title | default: "PDF Document" }}
    </div>

    <a
      class="pdf-open-btn"
      href="{{ include.url | relative_url }}"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open PDF in new tab"
      title="Open PDF in new tab">

      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M15 3h6v6"></path>
        <path d="M10 14L21 3"></path>
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>

      </svg>
    </a>

  </div>

  <div class="pdf-widget-content">

    <div class="pdf-widget-body">
      <iframe
        src="{{ include.url | relative_url }}#view=FitH"
        title="{{ include.title | default: 'PDF Document' }}"
        loading="lazy">
      </iframe>
    </div>

    {% if include.caption %}
    <div class="pdf-widget-caption">
      {{ include.caption }}
    </div>
    {% endif %}

  </div>

</div>
