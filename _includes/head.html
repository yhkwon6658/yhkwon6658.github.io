<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="dKHGr9nGyHB_tpJCgH5hUJ0uf-E9WC3qKVwiZ5xzYow" />
  
  {% seo %}

  <!-- CSS -->
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Libre+Baskerville:400,400i,700">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon/favicon-32x32.png" | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/favicon/favicon-16x16.png" | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/favicon/apple-icon-180x180.png" | relative_url }}">

  <!-- RSS -->
  {% feed_meta %}

  <!-- Google Analytics-->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-G87HD3KC9S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  
    gtag('config', 'G-G87HD3KC9S');
  </script>

  <style>
    /* ==========================================
       1. 다크 모드 텍스트 및 배경 색상 강제 적용
       ========================================== */
    body.dark-mode { 
        background-color: #121212 !important; /* 너무 쨍한 흑색보다 눈이 편한 다크 그레이 */
        color: #e0e0e0 !important; 
    }
    
    /* 다크 모드 링크 색상 */
    body.dark-mode a { color: #58a6ff !important; }
    body.dark-mode a:hover { color: #79c0ff !important; }

    /* 🔥 [핵심] 블로그 제목, 포스트 제목, 카테고리 탭 글자 강제 흰색 */
    body.dark-mode h1, body.dark-mode h2, body.dark-mode h3, 
    body.dark-mode h4, body.dark-mode h5, body.dark-mode h6,
    body.dark-mode .post-title, 
    body.dark-mode .catalogue-title,
    body.dark-mode .tags-item-label,
    body.dark-mode .tags-post-title,
    body.dark-mode .nav-title {
        color: #ffffff !important;
    }

    /* 🔥 [핵심] 날짜, 작성자 등 부가 정보 회색 */
    body.dark-mode .post-info, 
    body.dark-mode .post-info *, 
    body.dark-mode .catalogue-time, 
    body.dark-mode .tags-post-meta time,
    body.dark-mode footer span {
        color: #a1a1aa !important;
    }

    /* 다크 모드 네비게이션 바 */
    body.dark-mode .nav-container { background-color: #121212 !important; }
    body.dark-mode .nav-container a { color: #e0e0e0 !important; }
    body.dark-mode .nav-container a:hover { color: #ffffff !important; }

    /* 다크 모드 인라인 코드 (문장 중간에 들어가는 코드) */
    body.dark-mode p code, body.dark-mode li code {
        background-color: #333333 !important;
        color: #ff7b72 !important;
    }

    /* ==========================================
       2. 맥OS 스타일 코드박스 (라이트/다크 공통)
       ========================================== */
    /* 기존 코드박스 배경 무시하고 어두운 박스 씌우기 */
    div.highlighter-rouge, figure.highlight, .highlight {
        background-color: #282c34 !important;
        border-radius: 8px !important;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3) !important;
        position: relative !important;
        margin: 1.5em 0 !important;
        padding: 40px 15px 15px 15px !important;
    }

    /* 맥 스타일 윈도우 버튼 (빨강, 노랑, 초록 점) */
    div.highlighter-rouge::before, figure.highlight::before, .highlight::before {
        content: "";
        position: absolute;
        top: 14px;
        left: 15px;
        width: 12px;
        height: 12px;
        background-color: #ff5f56 !important;
        border-radius: 50% !important;
        box-shadow: 20px 0 0 #ffbd2e, 40px 0 0 #27c93f !important;
        z-index: 10 !important;
    }

    /* 코드 영역 내부 배경 투명화 및 글자색 설정 */
    div.highlighter-rouge pre, figure.highlight pre, .highlight pre,
    div.highlighter-rouge code, figure.highlight code, .highlight code {
        background: transparent !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        color: #abb2bf !important;
        overflow-x: auto !important;
        font-family: 'D2Coding', 'Consolas', monospace !important;
    }
    
    /* 다크 모드 토글 버튼 설정 */
    #theme-toggle { all: unset; cursor: pointer; font-size: 20px; }
    #theme-toggle:hover { transform: scale(1.1); transition: transform 0.2s ease-in-out; }
  </style>
</head>
