<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="dKHGr9nGyHB_tpJCgH5hUJ0uf-E9WC3qKVwiZ5xzYow" />
  
  {% seo %}

  <!-- CSS -->
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Libre+Baskerville:400,400i,700">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon/favicon-32x32.png" | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/favicon/favicon-16x16.png" | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/favicon/apple-icon-180x180.png" | relative_url }}">

  <!-- RSS -->
  {% feed_meta %}

  <!-- Google Analytics-->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-G87HD3KC9S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  
    gtag('config', 'G-G87HD3KC9S');
  </script>

  <style>
    /* 다크 모드 활성화 시 반전 색상 */
    body.dark-mode {
        background-color: #000; /* 완전 검은색 */
        color: #f8f8f2; /* 본문 텍스트를 눈에 띄는 밝은 색으로 */
    }

    /* 다크 모드에서 링크 스타일 */
    body.dark-mode a {
        color: #ffcc00;
    }
    body.dark-mode a:hover {
        color: #ff6600;
    }

    /* 다크 모드 네비게이션 스타일 */
    body.dark-mode .nav-container {
        background-color: #000;
        color: #fff;
    }
    body.dark-mode .nav-container a {
        color: #ffcc00;
    }
    body.dark-mode .nav-container a:hover {
        color: #ff6600;
    }

    /* 🔥 [추가] 다크 모드일 때 제목(H1~H6) 및 타이틀 색상을 밝게(흰색) 강제 적용 */
    body.dark-mode h1, 
    body.dark-mode h2, 
    body.dark-mode h3, 
    body.dark-mode h4, 
    body.dark-mode h5, 
    body.dark-mode h6,
    body.dark-mode .post-title,
    body.dark-mode .catalogue-title {
        color: #ffffff !important;
    }

    /* 🔥 [추가] 다크 모드일 때 글쓴이, 날짜 등 부가 정보 색상을 밝은 회색으로 조정 */
    body.dark-mode .post-info,
    body.dark-mode .post-info span,
    body.dark-mode .post-info time,
    body.dark-mode .post-info a,
    body.dark-mode .catalogue-time {
        color: #aaaaaa !important;
    }

    /* 다크 모드 버튼 기본 스타일 */
    #theme-toggle {
        all: unset;
        cursor: pointer;
        font-size: 20px;
    }
    #theme-toggle:hover {
        transform: scale(1.1);
        transition: transform 0.2s ease-in-out;
    }
  </style>
</head>
